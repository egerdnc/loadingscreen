<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SINGULARITY</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="scene__sky"></div>
    <video id="bg" class="scene__video" muted playsinline preload="auto"></video>
    <div class="scene__grade"></div>
    <div class="scene__vignette"></div>
    <div class="scene__grain"></div>
  </div>

  <div class="bar bar--top" aria-hidden="true"></div>
  <div class="bar bar--bottom" aria-hidden="true"></div>

  <main class="card" role="status" aria-live="polite">
    <svg class="card__lambda" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="lambda__ring" cx="50" cy="50" r="44" />
      <path class="lambda__glyph" d="M 33 78 L 47 44 Q 50 36 46 28 L 42 20 M 46 41 L 61 78" />
    </svg>
    <h1 class="card__wordmark" id="wordmark">SINGULARITY</h1>
    <div class="card__rule" aria-hidden="true"></div>
    <h2 class="card__chapter" id="chapter">CITY TWENTY-FOUR</h2>
    <p class="card__caption" id="caption">&nbsp;</p>
  </main>

  <section class="loader" id="loader" aria-label="Loading progress">
    <div class="loader__head">
      <span class="loader__title" id="loaderTitle">LOADING&nbsp;.&nbsp;.&nbsp;.</span>
      <span class="loader__pct" id="loaderPct"></span>
    </div>
    <div class="loader__segments" id="segments"></div>
    <p class="loader__status" id="status">Establishing network connection</p>
  </section>

  <audio id="bgm" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
