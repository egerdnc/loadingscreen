<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SINGULARITY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="scene__sky"></div>
    <video id="bg" class="scene__video" muted playsinline preload="auto"></video>
    <div class="scene__grade"></div>
    <div class="scene__vignette"></div>
    <div class="scene__grain"></div>
  </div>

  <div class="bar bar--top" aria-hidden="true"></div>

  <main class="card" role="status" aria-live="polite">
    <img class="card__mark" src="assets/brand/mark-glow.svg" alt="" />
    <h1 class="card__wordmark"><img class="card__wordmark-img" src="assets/brand/wordmark-white.svg" alt="SINGULARITY" /></h1>
    <div class="card__stamp">PRE-ALPHA</div>
  </main>

  <footer class="bar bar--bottom" aria-label="Loading progress">
    <div class="progress" aria-hidden="true">
      <div class="progress__fill" id="progressFill"></div>
    </div>
    <span class="hud__status" id="status">Establishing network connection</span>
    <span class="hud__info" id="info"></span>
    <span class="hud__pct" id="loaderPct"></span>
  </footer>

  <audio id="bgm" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
